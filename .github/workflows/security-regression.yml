name: Linux security regression

on:
  workflow_dispatch:
  push:
    branches: [dev_new, 'fix/**']
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Dockerfile
      - .dockerignore
      - 'scripts/**'
      - .github/workflows/security-regression.yml
  pull_request:
    branches: [dev_new]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Dockerfile
      - .dockerignore
      - 'scripts/**'
      - .github/workflows/security-regression.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOEXPERIMENT: jsonv2
      V2BX_REQUIRE_MPTCP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module graph
        id: modules
        run: go mod tidy -diff
      - name: Check installer syntax and isolated behavior
        run: |
          bash -n scripts/install.sh
          bash scripts/tests/install_test.sh
      - name: Test config loading and watcher cleanup
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race -count=1 -timeout=60s ./conf
      - name: Test log output fallback and cleanup
        run: go test -mod=readonly -count=1 -timeout=30s -run '^TestConfigureLogOutput' ./cmd
      - name: Test built-in update entry point without network access
        run: go test -mod=readonly -count=1 -timeout=30s -run '^TestUpdateInstaller' ./cmd
      - name: Test Vision TLS buffer compatibility
        run: go test -mod=readonly -v -run '^TestAccessTLSBuffers$' github.com/xtls/xray-core/proxy/vless
      - name: Enable MPTCP on the disposable runner for regression coverage
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        run: sudo sysctl -w net.mptcp.enabled=1
      - name: Test default TCP listeners and Xray's explicit MPTCP opt-out
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        run: go test -mod=readonly -v -run '^(TestMPTCPDisabledByDefault|TestXrayDisablesMPTCPByDefault)$' .
      - name: Build all supported cores together
        id: build
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        run: go build -mod=readonly -trimpath -o /tmp/V2bX -tags 'sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor' .
      - name: Smoke test the Linux binary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          /tmp/V2bX version
          if /tmp/V2bX not-a-real-command; then
            echo 'Invalid commands must return a nonzero exit status.' >&2
            exit 1
          fi
      - name: Install and update the real binary in an isolated directory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo bash scripts/tests/install_binary_test.sh /tmp/V2bX

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Enable ARM64 runtime emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and load image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: v2bx:ci
          cache-from: type=gha,scope=v2bx-validation-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=v2bx-validation-${{ matrix.arch }}
      - name: Smoke test the container
        run: docker run --rm --platform linux/${{ matrix.arch }} --entrypoint V2bX v2bx:ci version
