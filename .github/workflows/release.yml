name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version label, for example v0.4.2'
        type: string
        required: false
      publish_release:
        description: 'Publish all successfully built packages to our repository'
        type: boolean
        default: false
  push:
    branches:
      - master
      - dev_new
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "example/**"
      - ".github/workflows/release.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs and installer
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == 'true' && -z "$RELEASE_TAG" ]]; then
            echo 'Publishing requires release_tag' >&2
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == 'true' ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
              echo 'Publishing requires a new, unused tag; existing tags are never moved.' >&2
              exit 1
            else
              status=$?
              [[ "$status" == 2 ]] || exit "$status"
            fi
          fi
          bash -n scripts/install.sh
          bash scripts/tests/install_test.sh

  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Android ARM 8
          - goos: android
            goarch: arm64
          # END Android ARM 8
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Get project dependencies
        run: |
          go mod download
      - name: Get release version
        if: ${{ github.event_name == 'release' }}
        run: |
          echo "version=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_ENV
      - name: Get other version
        if: ${{ github.event_name != 'release' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "version=${RELEASE_TAG:-$GITHUB_SHA}" >> $GITHUB_ENV
      - name: Build V2bX
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/V2bX -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat V2bX
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/V2bX_softfloat -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -ldflags "-X 'github.com/InazumaV/V2bX/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows V2bX
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv V2bX V2bX.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/example/*.json ./build_assets/
          cp ${GITHUB_WORKSPACE}/example/*.dat ./build_assets/
          cp ${GITHUB_WORKSPACE}/example/*.db ./build_assets/
          cp -R ${GITHUB_WORKSPACE}/docs ./build_assets/docs
          cp ${GITHUB_WORKSPACE}/scripts/install.sh ./build_assets/install.sh
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../V2bX-$ASSET_NAME.zip .
          popd || exit 1
          FILE=V2bX-$ASSET_NAME.zip
          sha256sum "$FILE" > "$FILE.sha256"
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./V2bX-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

  publish:
    if: github.repository == 'xn9kqy58k/V2bX' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: V2bX-*
          path: release_assets
          merge-multiple: true
      - name: Verify packages and publish our release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd release_assets
          for checksum in *.zip.sha256; do
            sha256sum -c "$checksum"
          done
          cd ..
          cp scripts/install.sh release_assets/install.sh
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo 'The requested tag already exists; refusing to publish mismatched source.' >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          gh release create "$RELEASE_TAG" release_assets/* \
            --target "$GITHUB_SHA" --title "V2bX $RELEASE_TAG" \
            --notes-file docs/releases/installer-release.md --latest
      - name: Verify public install and update downloads in isolated directories
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          install_dir="$RUNNER_TEMP/v2bx-public-check/bin"
          config_dir="$RUNNER_TEMP/v2bx-public-check/config"
          service_dir="$RUNNER_TEMP/v2bx-public-check/service"
          sudo bash scripts/install.sh install --version "$RELEASE_TAG" \
            --install-dir "$install_dir" --config-dir "$config_dir" \
            --service-dir "$service_dir" --no-service
          "$install_dir/V2bX" version | grep -F "$RELEASE_TAG"
          sudo cp "$config_dir/config.json.example" "$config_dir/config.json"
          before=$(sudo sha256sum "$config_dir/config.json")
          sudo bash scripts/install.sh update \
            --install-dir "$install_dir" --config-dir "$config_dir" \
            --service-dir "$service_dir" --no-service
          after=$(sudo sha256sum "$config_dir/config.json")
          test "$before" = "$after"
          "$install_dir/V2bX" version | grep -F "$RELEASE_TAG"
